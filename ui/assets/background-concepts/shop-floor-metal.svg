<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25282b"/>
      <stop offset="1" stop-color="#151719"/>
    </linearGradient>
    <pattern id="plate" width="70" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="70" height="40" fill="transparent"/>
      <ellipse cx="16" cy="20" rx="12" ry="6" fill="rgba(255,255,255,.08)"/>
      <ellipse cx="50" cy="20" rx="12" ry="6" fill="rgba(0,0,0,.14)"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,.55)"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#plate)" opacity=".8"/>
  <ellipse cx="230" cy="760" rx="220" ry="90" fill="rgba(40,30,18,.18)"/>
  <ellipse cx="1360" cy="170" rx="180" ry="65" fill="rgba(25,32,40,.20)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>

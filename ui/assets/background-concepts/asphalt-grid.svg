<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121418"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <filter id="asphalt"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer></filter>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" fill="none" stroke="rgba(105,125,145,.22)" stroke-width="1"/>
    </pattern>
    <radialGradient id="spot" cx="50%" cy="42%" r="38%">
      <stop offset="0" stop-color="rgba(120,150,185,.18)"/>
      <stop offset="100%" stop-color="rgba(120,150,185,0)"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" filter="url(#asphalt)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102b4c"/>
      <stop offset="1" stop-color="#0b1c33"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(210,230,255,.16)" stroke-width="1"/>
    </pattern>
    <filter id="concrete"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" filter="url(#concrete)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g stroke="rgba(225,240,255,.28)" stroke-width="2" fill="none">
    <rect x="150" y="170" width="700" height="460"/>
    <line x1="150" y1="260" x2="850" y2="260"/>
    <line x1="410" y1="170" x2="410" y2="630"/>
    <circle cx="1080" cy="430" r="180"/>
  </g>
  <g fill="rgba(225,240,255,.35)" font-family="monospace" font-size="18">
    <text x="160" y="150">SCALE 1/8&quot; = 1'-0&quot;</text>
    <text x="1180" y="650">ELEV. 24'-6"</text>
  </g>
</svg>

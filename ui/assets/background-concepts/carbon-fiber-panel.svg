<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="transparent"/>
      <rect x="0" y="0" width="10" height="10" fill="#1f1f1f"/>
      <rect x="10" y="10" width="10" height="10" fill="#1f1f1f"/>
      <rect x="10" y="0" width="10" height="10" fill="#151515"/>
      <rect x="0" y="10" width="10" height="10" fill="#151515"/>
    </pattern>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="70%">
      <stop offset="70%" stop-color="rgba(190,30,45,0)"/>
      <stop offset="100%" stop-color="rgba(190,30,45,.28)"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#weave)" opacity=".95"/>
  <rect width="1600" height="900" fill="url(#redGlow)"/>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MC Finder</title>
  <style>
    :root { --red:#be1e2d; --bg:#0a0a0a; --card:#141414; --line:#262626; --text:#f4f4f4; --muted:#b3b3b3; }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 25% 10%, #1a1a1a, #080808 60%);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:14px}
    .shell{width:100%;max-width:430px}
    .app{background:linear-gradient(180deg,#121212,#0e0e0e);border:1px solid #1f1f1f;border-radius:24px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.6);min-height:min(900px,calc(100vh - 28px))}
    .top{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
    .logo{width:42px;height:48px;object-fit:contain}
    .h1{font-size:1.05rem;font-weight:700;margin:0}
    .sub{margin:2px 0 0;color:var(--muted);font-size:.78rem}
    .body{padding:12px;display:grid;gap:9px}
    label{font-size:.75rem;color:#c8c8c8}
    input,select,button{width:100%;border-radius:12px;border:1px solid #2b2b2b;background:#181818;color:#fff;padding:11px 10px}
    input:focus,select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 2px rgba(190,30,45,.2)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .check{display:flex;align-items:center;gap:8px;padding:4px 2px}
    .check input{width:auto;accent-color:var(--red)}
    .btn{background:linear-gradient(180deg,#d4293a,#be1e2d);border:0;font-weight:700;cursor:pointer}
    .btn2{background:#202020;border:1px solid #323232;cursor:pointer}
    .btn3{background:#101010;border:1px dashed #3a3a3a;color:#ddd;cursor:pointer}
    .status{font-size:.78rem;color:#d7d7d7;min-height:20px;white-space:pre-wrap}
    .meta{font-size:.75rem;color:#a6a6a6}
    .list{display:grid;gap:8px;max-height:48vh;overflow:auto;padding-right:2px}
    .item{border:1px solid #272727;border-radius:14px;background:#141414;padding:10px}
    .name{font-weight:700;font-size:.9rem;margin-bottom:4px}
    .line{font-size:.78rem;color:#d3d3d3;word-break:break-word}
    .line a{color:#ff5f6d;text-decoration:none}
    .line a:hover{text-decoration:underline}
    .badge{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:999px;border:1px solid #3a3a3a;color:#ddd;margin-right:5px}
    .badge.red{border-color:#5f1a21;color:#ffadb5;background:rgba(190,30,45,.18)}
  </style>
</head>
<body>
  <div class="shell">
    <div class="app">
      <div class="top">
        <img class="logo" src="/assets/logo.png" alt="MC logo" />
        <div>
          <p class="h1">MC Business Finder</p>
          <p class="sub">Google Places API (New) only</p>
        </div>
      </div>

      <div class="body">
        <div>
          <label for="location">Location (ZIP, city, state)</label>
          <input id="location" placeholder="Clinton, NC or 28328" />
        </div>

        <div>
          <label for="query">Business Query</label>
          <input id="query" value="" placeholder="e.g. electrical contractor" />
        </div>

        <div class="row">
          <div>
            <label for="radiusMiles">Radius (miles)</label>
            <input id="radiusMiles" type="number" min="5" max="45" value="25" />
          </div>
          <div>
            <label for="mode">Mode</label>
            <select id="mode">
              <option value="single">Single</option>
              <option value="statewide">Statewide</option>
            </select>
          </div>
        </div>

        <label class="check"><input id="includeEmails" type="checkbox" /> Find website emails (slower)</label>

        <div class="row">
          <button id="searchBtn" class="btn">Search</button>
          <button id="downloadBtn" class="btn2">Download CSV</button>
        </div>
        <button id="appWindowBtn" class="btn3">Open App Window (430x900)</button>

        <div id="status" class="status">Ready. Use Open-App.command for one-click launch.</div>
        <div id="meta" class="meta"></div>

        <div id="list" class="list"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const els = {
      location: $("location"),
      query: $("query"),
      radiusMiles: $("radiusMiles"),
      mode: $("mode"),
      includeEmails: $("includeEmails"),
      searchBtn: $("searchBtn"),
      downloadBtn: $("downloadBtn"),
      appWindowBtn: $("appWindowBtn"),
      status: $("status"),
      meta: $("meta"),
      list: $("list")
    };

    let rows = [];

    function setStatus(text) { els.status.textContent = text; }

    function openAppWindow() {
      const url = new URL(window.location.href);
      url.searchParams.set("appwindow", "1");
      const w = window.open(url.toString(), "mc_finder_app_window", "popup=yes,width=430,height=900");
      if (!w) {
        setStatus("Popup blocked. Allow popups for this site, then try again.");
      }
    }

    function render(items) {
      if (!items.length) {
        els.list.innerHTML = "";
        return;
      }
      els.list.innerHTML = items.map((r) => `
        <div class="item">
          <div class="name">${r.name || "(no name)"}</div>
          <div class="line"><span class="badge">score ${r.confidence || 0}</span><span class="badge">${r.distance_miles !== undefined && r.distance_miles !== \"\" ? `${r.distance_miles} mi` : \"\"}</span></div>
          <div class="line">${r.address || ""}</div>
          <div class="line">${r.phone || ""}</div>
          <div class="line">${r.website ? `<a href="${r.website}" target="_blank" rel="noopener noreferrer">${r.website}</a>` : ""}</div>
          <div class="line">${r.emails || ""}</div>
          <div class="line">${r.maps_url ? `<a href="${r.maps_url}" target="_blank" rel="noopener noreferrer">map</a>` : ""}</div>
        </div>
      `).join("");
    }

    function csvEscape(v) {
      const s = String(v ?? "");
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function downloadCsv(data) {
      const headers = ["name","phone","website","address","distance_miles","maps_url","place_id","business_status","confidence","emails"];
      const lines = [headers.join(",")];
      data.forEach((r) => lines.push(headers.map((h) => csvEscape(r[h])).join(",")));
      const blob = new Blob([lines.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "places-results.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function runSearch() {
      const payload = {
        location: els.location.value.trim(),
        query: els.query.value.trim() || "general contractor",
        radiusMiles: Number(els.radiusMiles.value || 25),
        mode: els.mode.value,
        includeEmails: els.includeEmails.checked
      };

      if (!payload.location) {
        setStatus("Enter a location first.");
        return;
      }

      els.searchBtn.disabled = true;
      setStatus("Searching live via Google Places (New)...");
      els.meta.textContent = "";
      rows = [];
      render(rows);

      try {
        const res = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        rows = (Array.isArray(data.rows) ? data.rows : []).filter((r) => r.source === "google_places_new");
        render(rows);
        const meta = data.meta || {};
        els.meta.textContent = `Provider: ${meta.provider || "-"} | Radius: ${meta.radius_miles || "-"} mi | Variants: ${meta.variants || "-"}`;
        const tail = Array.isArray(data.logs) ? data.logs.slice(-3).join("\n") : "";
        setStatus(`Done: ${rows.length} results.\n${tail}`);
      } catch (err) {
        setStatus(`Search failed: ${err.message}`);
      } finally {
        els.searchBtn.disabled = false;
      }
    }

    els.searchBtn.addEventListener("click", runSearch);
    els.appWindowBtn.addEventListener("click", openAppWindow);
    els.downloadBtn.addEventListener("click", () => {
      if (!rows.length) return setStatus("No rows to download.");
      downloadCsv(rows);
    });

    // Best effort: when opened as popup, resize to app dimensions.
    if (new URLSearchParams(window.location.search).get("appwindow") === "1") {
      try {
        window.resizeTo(430, 900);
      } catch (_) {}
    }
  </script>
</body>
</html>
